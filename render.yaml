services:
  # Full-stack Next.js app on Render
  - type: web
    name: joes-ai
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JSONBIN_BIN_ID
        sync: false
      - key: JSONBIN_MASTER_KEY
        sync: false