<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joes AI - Kilo Interface</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { mono: ['Consolas', 'Monaco', 'Courier New', 'monospace'] } } }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #000; }
      ::-webkit-scrollbar-thumb { background: #166534; }
      * { scrollbar-width: thin; scrollbar-color: #166534 #000; }
    }
  </style>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    input::placeholder { color: #166534; opacity: 0.5; }
    .scanline {
      width: 100%; height: 2px; z-index: 10;
      background: rgba(0, 255, 0, 0.05); opacity: 0.1;
      position: absolute; pointer-events: none;
      animation: scanline 8s linear infinite;
    }
    @keyframes scanline { 0% { top: 0; } 100% { top: 100%; } }
    @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.95; } }
    @keyframes pulse { 0%, 100% { text-shadow: 0 0 5px #166534, 0 0 10px #166534; } 50% { text-shadow: 0 0 10px #22c55e, 0 0 20px #22c55e; } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    .glow-text { animation: pulse 3s infinite; }
    .terminal-cursor { animation: blink 1s infinite; }
    .crt-glow { box-shadow: 0 0 20px #166534, inset 0 0 20px rgba(0, 255, 0, 0.1); }
  </style>
</head>
<body>
  <div class="scanline"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const KEYS = {
        gemini: 'AIzaSyCuuVHX9vJ8TyAOjBgFhTlOVI498ZeyxH0',
        groq: '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',
        jsonbin: { binId: '[69f650dfaaba88219763b56b]', masterKey: '[$2a$10$vdW0.EhGL78n1cRjNxKy0.pCgWSGaRJu4vWBPt2n8KRIoGFQhRsZS]' }
    };

    const Sidebar = ({ activeTab, setActiveTab, nightMode }) => {
      const tabs = [
        { id: 'coding', name: 'CODING', shortcut: '1' },
        { id: 'questions', name: 'CHAT', shortcut: '2' },
        { id: 'personal', name: 'PERSONAL', shortcut: '3' },
        { id: 'images', name: 'IMAGES', shortcut: '4' },
        { id: 'football', name: 'FOOTBALL', shortcut: '5' },
      ]
      return (
        <div className={`w-48 border-r border-green-900 bg-black flex flex-col z-20 ${nightMode ? '' : 'bg-gray-50'}`}>
          <div className={`p-4 border-b border-green-900 text-green-500 font-bold text-lg tracking-widest ${nightMode ? 'glow-text' : 'text-gray-800'}`}>JOES AI<span className="text-red-500">_</span></div>
          <div className="flex-1 py-4">
            {tabs.map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                className={`w-full text-left px-4 py-2 flex justify-between items-center transition-all
                  ${activeTab === tab.id ? 'bg-green-900 text-green-200' : 'text-green-700 hover:bg-green-950 hover:text-green-500'}`}>
                <span>{tab.name}</span>
                <span className="text-[10px] opacity-50">[{tab.shortcut}]</span>
              </button>
            ))}
          </div>
          <div className="p-4 border-t border-green-900 text-green-800 text-[10px] uppercase">
            <span className="text-green-500">System:</span> Active<br/><span className="text-green-500">Channel:</span> 01
          </div>
        </div>
      )
    }

    const ChatArea = ({ activeTab, currentProvider, nightMode }) => {
      const [messages, setMessages] = useState(() => {
        const saved = localStorage.getItem('joes-ai-chat');
        return saved ? JSON.parse(saved) : [];
      });
      const [input, setInput] = useState('');
      const [attachments, setAttachments] = useState([]);
      const [storageStatus, setStorageStatus] = useState('LOCAL');
      const scrollRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('joes-ai-chat', JSON.stringify(messages));
        scrollRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const handleFileUpload = async (files) => {
        const validTypes = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'text/plain', 'image/jpeg', 'image/png', 'image/gif', 'image/webp'];
        const maxSize = 500 * 1024 * 1024; // 500MB
        const newFiles = Array.from(files).filter(f => validTypes.includes(f.type) && f.size <= maxSize);
        if (newFiles.length + attachments.length > 10) {
          alert('Max 10 files allowed');
          return;
        }
        setAttachments(prev => [...prev, ...newFiles]);
      };

      const syncToCloud = async () => {
        setStorageStatus('SYNCING...');
        try {
          const payload = { messages, attachments, timestamp: Date.now() };
          await fetch(`https://api.jsonbin.io/v3/b/${KEYS.jsonbin.binId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': KEYS.jsonbin.masterKey },
            body: JSON.stringify(payload)
          });
          setStorageStatus('SYNCED');
        } catch (e) {
          setStorageStatus('ERROR');
        }
      };

      const loadFromCloud = async () => {
        setStorageStatus('LOADING...');
        try {
          const res = await fetch(`https://api.jsonbin.io/v3/b/${KEYS.jsonbin.binId}/latest`, {
            headers: { 'X-Master-Key': KEYS.jsonbin.masterKey }
          });
          const data = await res.json();
          setMessages(data.record.messages || []);
          setAttachments(data.record.attachments || []);
          setStorageStatus('LOADED');
        } catch (e) {
          setStorageStatus('ERROR');
        }
      };

      const getSystemPrompt = () => {
        const prompts = {
          coding: "You are a senior software architect. Provide clean, efficient code and technical explanations.",
          questions: "You are a helpful and concise AI assistant.",
          personal: "You are a wise, empathetic advisor providing grounded life and career advice.",
          images: "You are an AI image prompt engineer. Help the user craft detailed, high-quality prompts.",
          football: "You are a sports data analyst. Focus on historical H2H stats, form analysis, and match predictions."
        };
        return prompts[activeTab] || prompts.questions;
      };

      const handleSend = async () => {
        if (!input.trim() && attachments.length === 0) return;
        const userText = input;
        const userAttachments = [...attachments];
        setMessages(prev => [...prev, { role: 'user', content: userText, attachments: userAttachments.map(f => ({ name: f.name, size: f.size, type: f.type })) }]);
        setInput('');
        setAttachments([]);
        setMessages(prev => [...prev, { role: 'ai', content: '>>> [PROCESSING_ATTACHMENTS...]' }]);

        try {
          let aiReply = "";
          if (userAttachments.length > 0 && currentProvider === 'gemini') {
            // Send file to Vercel API
            const formData = new FormData();
            formData.append('file', userAttachments[0]); // First file
            formData.append('prompt', userText + '\n\nSystem: ' + getSystemPrompt());
            const response = await fetch('https://your-vercel-app.vercel.app/api/process-file', { // Replace with your Vercel URL
              method: 'POST',
              body: formData
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            aiReply = data.response;
          } else {
            if (currentProvider === 'gemini') {
              const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${KEYS.gemini}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  system_instruction: { parts: { text: getSystemPrompt() } },
                  contents: [{ parts: [{ text: userText + (userAttachments.length > 0 ? `\n\nAttachments: ${userAttachments.map(f => f.name).join(', ')}` : '') }] }]
                })
              });
              const data = await response.json();
              if (data.error) throw new Error(data.error.message);
              aiReply = data.candidates[0].content.parts[0].text;
            } else {
              const messages = [
                { role: 'system', content: getSystemPrompt() },
                { role: 'user', content: userText + (userAttachments.length > 0 ? `\n\nAttachments: ${userAttachments.map(f => f.name).join(', ')}` : '') }
              ];
              const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${KEYS.groq}` },
                body: JSON.stringify({
                  model: 'llama-3.3-70b-versatile',
                  messages
                })
              });
              const data = await response.json();
              if (data.error) throw new Error(data.error.message);
              aiReply = data.choices[0].message.content;
            }
          }
          setMessages(prev => {
            const updated = [...prev];
            updated[updated.length - 1] = { role: 'ai', content: aiReply };
            return updated;
          });
        } catch (e) {
          setMessages(prev => {
            const updated = [...prev];
            updated[updated.length - 1] = { role: 'ai', content: `!!! CRITICAL_ERROR: ${e.message}` };
            return updated;
          });
        }
      };

      return (
        <div className={`h-full flex flex-col ${nightMode ? 'bg-black crt-glow' : 'bg-white'}`}>
          <div className={`h-8 border-b border-green-900 flex items-center px-4 justify-between ${nightMode ? 'bg-black' : 'bg-gray-50'}`}>
            <div className="text-[10px] text-green-700">
              <span className="text-green-500">Mode:</span> {activeTab.toUpperCase()} | <span className="text-green-500">Provider:</span> {currentProvider.toUpperCase()}
            </div>
            <button onClick={() => {
              const blob = new Blob([messages.map(m => `[${m.role.toUpperCase()}]: ${m.content}`).join('\n\n')], {type: 'text/plain'});
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `chat-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.txt`;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
            }} className="text-[10px] px-2 py-0.5 border border-green-900 text-green-800 hover:bg-green-900 hover:text-green-200 transition-colors">DL ALL</button>
          </div>
          <div ref={scrollRef} className={`flex-1 overflow-y-auto p-6 font-mono text-xs ${nightMode ? 'text-green-500' : 'text-gray-800'}`}>
            {messages.length === 0 ? (
              <div className={`${nightMode ? 'opacity-40' : 'opacity-60'}`}><pre className={nightMode ? '' : 'text-gray-600'}>{`
  [INIT] BOOT SEQUENCE COMPLETE
  [INFO] MODE: ${activeTab.toUpperCase()}
  [INFO] PROVIDER: ${currentProvider.toUpperCase()}
  ------------------------------------------------
  Ready for input...
              `}</pre></div>
            ) : (
              messages.map((msg, i) => (
                <div key={i} className={`mb-4 ${msg.role === 'user' ? 'text-green-300' : nightMode ? 'text-green-500' : 'text-blue-600'}`}>
                  <div className="flex items-start justify-between">
                    <span className={`opacity-50 ${nightMode ? '' : 'text-gray-500'}`}>{msg.role === 'user' ? '[USR@ROOT]:' : '[SYS@AI]:'}</span>
                    {msg.role === 'ai' && (
                      <div className="flex gap-2">
                        <button onClick={() => { navigator.clipboard.writeText(msg.content); }}
                          className={`text-[10px] px-2 py-0.5 border ${nightMode ? 'border-green-700 text-green-700 hover:bg-green-900 hover:text-green-200' : 'border-blue-300 text-blue-500 hover:bg-blue-100'}`}>COPY</button>
                        <button onClick={() => {
                          const blob = new Blob([msg.content], {type: 'text/plain'});
                          const url = URL.createObjectURL(blob);
                          const a = document.createElement('a');
                          a.href = url;
                          a.download = `ai-response-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.txt`;
                          document.body.appendChild(a);
                          a.click();
                          document.body.removeChild(a);
                          URL.revokeObjectURL(url);
                        }}
                          className={`text-[10px] px-2 py-0.5 border ${nightMode ? 'border-green-700 text-green-700 hover:bg-green-900 hover:text-green-200' : 'border-blue-300 text-blue-500 hover:bg-blue-100'}`}>DL</button>
                      </div>
                    )}
                  </div>
                  {msg.attachments && msg.attachments.length > 0 && (
                    <div className={`mb-2 flex flex-wrap gap-1 text-[10px] ${nightMode ? 'text-green-600' : 'text-blue-600'}`}>
                      <span className={nightMode ? 'text-green-500' : 'text-blue-500'}>Attachments:</span>
                      {msg.attachments.map((f, j) => (
                        <span key={j} className={`px-1 py-0.5 border ${nightMode ? 'border-green-700' : 'border-blue-300'} rounded`}>
                          {f.name.slice(0, 20)}{f.name.length > 20 ? '..' : ''}
                        </span>
                      ))}
                    </div>
                  )}
                  <pre className={`mt-1 whitespace-pre-wrap pl-4 border-l ${nightMode ? 'border-green-900' : 'border-blue-200'}`}>{msg.content}</pre>
                </div>
              ))
            )}
          </div>
          <div className={`p-4 border-t ${nightMode ? 'border-green-900' : 'border-gray-300'} flex items-start gap-3`}>
            <div className="flex flex-col gap-2">
              <label className={`cursor-pointer text-xs px-2 py-1 border ${nightMode ? 'border-green-700 text-green-500 hover:bg-green-900' : 'border-blue-300 text-blue-500 hover:bg-blue-100'}`}>
                ATTACH
                <input type="file" multiple accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png,.gif,.webp" onChange={e => handleFileUpload(e.target.files)} className="hidden" />
              </label>
              <span className={`text-[10px] ${nightMode ? 'text-green-700' : 'text-gray-500'}`}>{attachments.length}/10 files</span>
            </div>
            <div className="flex-1 flex flex-col">
              <div className="flex items-center gap-3">
                <span className={`font-bold ${nightMode ? 'text-green-500' : 'text-blue-500'}`}>>>></span>
                <div className="flex-1 flex flex-col gap-1">
                  <input autoFocus type="text" value={input} onChange={e => setInput(e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && handleSend()} placeholder="ENTER COMMAND..."
                    className={`w-full bg-transparent border-none outline-none font-mono ${nightMode ? 'text-green-400' : 'text-gray-700'}`} />
                  {attachments.length > 0 && (
                    <div className={`flex flex-wrap gap-1 text-[10px] ${nightMode ? 'text-green-600' : 'text-blue-600'}`}>
                      {attachments.map((f, i) => (
                        <span key={i} className={`px-1 py-0.5 border ${nightMode ? 'border-green-700' : 'border-blue-300'} rounded`}>
                          {f.name.slice(0, 15)}{f.name.length > 15 ? '..' : ''}
                        </span>
                      ))}
                    </div>
                  )}
                </div>
              </div>
              <span className={`terminal-cursor font-bold ${nightMode ? 'text-green-500' : 'text-blue-500'} self-end`}>_</span>
              <div className={`text-[10px] mt-2 ${nightMode ? 'text-green-700' : 'text-gray-500'}`}>
                <span className={nightMode ? 'text-green-500' : 'text-blue-500'}>Storage:</span> {storageStatus} |
                <button onClick={syncToCloud} className={`ml-2 underline ${nightMode ? 'text-green-400' : 'text-blue-500'}`}>SYNC NOW</button> |
                <button onClick={loadFromCloud} className={`ml-2 underline ${nightMode ? 'text-green-400' : 'text-blue-500'}`}>LOAD CLOUD</button>
              </div>
            </div>
          </div>
        </div>
      )
    }

    const App = () => {
      const [activeTab, setActiveTab] = useState('coding');
      const [currentProvider, setCurrentProvider] = useState('groq');
      const [nightMode, setNightMode] = useState(true);
      return (
        <div className={`flex h-screen font-mono selection:bg-green-900 selection:text-white transition-all ${nightMode ? 'bg-black text-green-500 crt-glow' : 'bg-gray-100 text-gray-800'}`}>
          <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} nightMode={nightMode} />
          <main className="flex-1 flex flex-col border-l border-green-900">
            <header className="h-10 border-b border-green-900 flex items-center px-6 justify-between bg-black z-20">
              <div className="text-[10px] tracking-widest flex items-center gap-4">
                <span className="text-green-700">NODE: 0x8892 // SECURE_AI_SESSIONS</span>
                <button onClick={() => setNightMode(!nightMode)} className="text-[10px] px-2 py-0.5 border border-green-900 text-green-800 hover:bg-green-900 hover:text-green-200 transition-colors">{nightMode ? 'LIGHT' : 'NIGHT'} MODE</button>
              </div>
              <div className="flex gap-4">
                {['groq', 'gemini'].map(p => (
                  <button key={p} onClick={() => setCurrentProvider(p)}
                    className={`text-[10px] px-2 py-0.5 border ${currentProvider === p ? 'bg-green-900 border-green-400 text-white' : 'border-green-900 text-green-800'}`}>
                    {p.toUpperCase()}
                  </button>
                ))}
              </div>
            </header>
            <div className="flex-1 overflow-hidden">
              <ChatArea activeTab={activeTab} currentProvider={currentProvider} nightMode={nightMode} />
            </div>
            <footer className="h-6 bg-green-900 text-black px-4 flex items-center justify-between text-[10px] font-bold">
              <span>STATUS: NOMINAL <span className="ml-2 text-green-200">●</span></span>
              <div className="flex gap-4"><span>PORT: 443</span><span>LATENCY: 12ms</span></div>
            </footer>
          </main>
        </div>
      )
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
